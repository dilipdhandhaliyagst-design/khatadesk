// --- Storage shim with optional Firebase cloud sync -----------------------
// Always reads/writes localStorage first (so the UI never waits on the
// network). If window.FIREBASE_CONFIG is set (see the config block near the
// top of this file), every write is also pushed to a free Firebase
// Firestore database, and every load pulls the latest value from there
// first — so the same data shows up on this website from your phone, your
// laptop, anywhere, no account sign-in needed on the page itself. With no
// Firebase config set, it just uses this device's local storage only.
(function () {
  var space = (window.FIREBASE_SPACE && String(window.FIREBASE_SPACE).trim()) || "default";
  var dbPromise = null;

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function getDb() {
    if (!window.FIREBASE_CONFIG) return Promise.resolve(null);
    if (dbPromise) return dbPromise;
    dbPromise = loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js")
      .then(function () {
        return loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
      })
      .then(function () {
        var app = firebase.initializeApp(window.FIREBASE_CONFIG);
        return firebase.firestore(app);
      })
      .catch(function (e) {
        console.error("KhataDesk: Firebase failed to load, using local storage only.", e);
        return null;
      });
    return dbPromise;
  }

  function docRef(db, key) {
    return db.collection("spaces").doc(space).collection("khatadesk").doc(key);
  }

  window.KhataDeskSync = {
    isAvailable: async () => !!(await getDb()),
  };

  window.storage = {
    get: async (key) => {
      const db = await getDb();
      if (db) {
        try {
          const snap = await docRef(db, key).get();
          if (snap.exists) {
            const data = snap.data();
            if (data && typeof data.value === "string") {
              try { localStorage.setItem(key, data.value); } catch (e) {}
              return { value: data.value };
            }
          }
        } catch (e) {
          // fall through to the local copy below
        }
      }
      try {
        const v = localStorage.getItem(key);
        return v === null ? null : { value: v };
      } catch (e) { return null; }
    },
    set: async (key, value) => {
      try { localStorage.setItem(key, value); } catch (e) {}
      const db = await getDb();
      if (db) {
        try { await docRef(db, key).set({ value: value, updated: Date.now() }); } catch (e) {}
      }
    },
  };
})();

function daysLeft(due) {
  const ms = new Date(due).setHours(0, 0, 0, 0) - new Date(today).setHours(0, 0, 0, 0);
  return Math.round(ms / (1000 * 60 * 60 * 24));
}

function Stamp_({ children, tone }) {
  const tones = {
    overdue: { border: "#A63D2F", text: "#A63D2F" },
    soon: { border: "#B8892B", text: "#B8892B" },
    filed: { border: "#2F6B4F", text: "#2F6B4F" },
    normal: { border: "#1C2B45", text: "#1C2B45" },
  };
  const c = tones[tone];
  return (
    <span
      className="inline-block -rotate-6 select-none"
      style={{
        border: `2px dashed ${c.border}`,
        color: c.text,
        fontFamily: "'IBM Plex Mono', monospace",
        fontSize: "10px",
        fontWeight: 600,
        letterSpacing: "0.08em",
        padding: "2px 8px",
        borderRadius: "3px",
        textTransform: "uppercase",
        background: "rgba(250,247,240,0.6)",
      }}
    >
      {children}
    </span>
  );
}

function StatusStamp({ status, due }) {
  if (status === "Filed") return <Stamp_ tone="filed">Filed</Stamp_>;
  const dl = daysLeft(due);
  if (dl < 0) return <Stamp_ tone="overdue">{Math.abs(dl)}d overdue</Stamp_>;
  if (dl <= 3) return <Stamp_ tone="soon">Due in {dl}d</Stamp_>;
  return <Stamp_ tone="normal">Due in {dl}d</Stamp_>;
}

  }, [checkins, loaded]);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("khatadesk:notes", JSON.stringify(notes)).catch(() => setSaveError(true));

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("khatadesk:visits", JSON.stringify(visits)).catch(() => setSaveError(true));
  }, [visits, loaded]);

  const stats = useMemo(() => {
    const pending = returns.filter((r) => r.status === "Pending");
    const overdue = pending.filter((r) => daysLeft(r.due) < 0).length;
    const dueSoon = pending.filter((r) => daysLeft(r.due) >= 0 && daysLeft(r.due) <= 3).length;
    const filedThisMonth = returns.filter((r) => r.status === "Filed").length;
    const clientCount = clients.length > 0 ? clients.length : new Set(returns.map((r) => r.client)).size;
    return { overdue, dueSoon, filedThisMonth, clients: clientCount };
  }, [returns, clients]);

  const sortedReturns = useMemo(() => {
    let list = [...returns];
    if (filterType !== "All") list = list.filter((r) => r.type === filterType);
    return list.sort((a, b) => new Date(a.due) - new Date(b.due));
  }, [returns, filterType]);

  const toggleTask = (id) =>
    setTasks((ts) => ts.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));

  const deleteTask = (id) => {
    const t = tasks.find((tk) => tk.id === id);
    if (!t) return;
    const ok = window.confirm(`Delete task "${t.title}"? This cannot be undone.`);
    if (!ok) return;
    setTasks((ts) => ts.filter((tk) => tk.id !== id));
    if (editingTaskId === id) {
      setEditingTaskId(null);
      setEditTaskDraft(null);
    }
  };

  const startEditTask = (t) => {
    setEditingTaskId(t.id);
    setEditTaskDraft({ title: t.title || "", client: t.client || "" });
    setShowAddTask(false);
  };

  const cancelEditTask = () => {
    setEditingTaskId(null);
    setEditTaskDraft(null);
  };

  const saveEditTask = () => {
    if (!editTaskDraft || !editTaskDraft.title.trim()) return;
    setTasks((ts) =>
      ts.map((t) =>
        t.id === editingTaskId
          ? { ...t, title: editTaskDraft.title.trim(), client: editTaskDraft.client.trim() || "General" }
          : t
      )
    );
    setEditingTaskId(null);
    setEditTaskDraft(null);
  };

  const toggleReturnStatus = (id) =>
    setReturns((rs) =>
      rs.map((r) => (r.id === id ? { ...r, status: r.status === "Filed" ? "Pending" : "Filed" } : r))
    );

  const addTask = () => {
    if (!newTask.title.trim()) return;
    setTasks((ts) => [
      { id: "t" + Date.now(), title: newTask.title, client: newTask.client || "General", due: d(0), done: false },
      ...ts,
    ]);
    setNewTask({ title: "", client: "" });
    setShowAddTask(false);
  };

  const addReturn = () => {
    if (!newReturn.client.trim() || !newReturn.due) return;
    setReturns((rs) => [
      {
        id: "r" + Date.now(),
        client: newReturn.client,
        type: newReturn.type,
        period: newReturn.period || "—",
        due: new Date(newReturn.due),
        status: "Pending",
        filedBy: newReturn.filedBy.trim().toUpperCase(),
        verifiedBy: newReturn.verifiedBy.trim().toUpperCase(),
      },
      ...rs,
    ]);
    setNewReturn({ client: "", type: "GSTR-3B", period: "", due: "", filedBy: "", verifiedBy: "" });
    setShowAddReturn(false);
  };

  const deleteReturn = (id) => {
    const r = returns.find((rt) => rt.id === id);
    if (!r) return;
    const ok = window.confirm(`Delete return "${r.type}" for "${r.client}"? This cannot be undone.`);
    if (!ok) return;
    setReturns((rs) => rs.filter((rt) => rt.id !== id));
    if (editingReturnId === id) {
      setEditingReturnId(null);
      setEditReturnDraft(null);
    }
  };

  const startEditReturn = (r) => {
    setEditingReturnId(r.id);
    setEditReturnDraft({
      client: r.client || "",
      type: r.type || "GSTR-3B",
      period: r.period || "",
      due: r.due ? new Date(r.due).toISOString().slice(0, 10) : "",
      filedBy: r.filedBy || "",
      verifiedBy: r.verifiedBy || "",
    });
    setShowAddReturn(false);
  };

  const cancelEditReturn = () => {
    setEditingReturnId(null);
    setEditReturnDraft(null);
  };

  const saveEditReturn = () => {

    setReturns((rs) =>
      rs.map((r) =>
        r.id === editingReturnId
          ? {
              ...r,
              client: editReturnDraft.client.trim(),
              type: editReturnDraft.type,
              period: editReturnDraft.period.trim() || "—",
              due: new Date(editReturnDraft.due),
              filedBy: editReturnDraft.filedBy.trim().toUpperCase(),
              verifiedBy: editReturnDraft.verifiedBy.trim().toUpperCase(),
            }
          : r
      )
    );
    setEditingReturnId(null);
    setEditReturnDraft(null);
  };

  const addClient = () => {
    if (!newClient.name.trim()) return;
    const savedName = newClient.name.trim();
    setClients((cs) => [
      {
        id: "c" + Date.now(),
        name: savedName,
        gstin: newClient.gstin.trim().toUpperCase(),
        pan: newClient.pan.trim().toUpperCase(),
        mobile: newClient.mobile.trim(),
        email: newClient.email.trim(),
        visitCount: Number(newClient.visitCount) || 1,
        visitPer: newClient.visitPer,
      },

    setClientSavedMsg(`"${savedName}" added successfully ✓`);
    setTimeout(() => setClientSavedMsg(""), 4000);

  const updateVisitTarget = (clientId, count, per) =>
    setClients((cs) => cs.map((c) => (c.id === clientId ? { ...c, visitCount: count, visitPer: per } : c)));

  const logVisit = () => {
    const client = clients.find((c) => c.id === visitDraft.clientId);
    if (!client || !visitDraft.note.trim()) return;
    setVisits((vs) => [
      {
        id: "v" + Date.now(),
        clientId: client.id,
        clientName: client.name,
        date: visitDraft.date || new Date().toISOString(),
        note: visitDraft.note.trim(),

      ...vs,

    setVisitDraft({ clientId: "", date: "", note: "" });
    stopRecording();
  };

  const deleteVisit = (id) => {
    const v = visits.find((vv) => vv.id === id);
    if (!v) return;
    const ok = window.confirm(`Delete this visit note for "${v.clientName}"? This cannot be undone.`);
    if (!ok) return;
    setVisits((vs) => vs.filter((vv) => vv.id !== id));
    if (editingVisitId === id) {
      setEditingVisitId(null);
      setEditVisitDraft(null);

  };

  const startEditVisit = (v) => {

    setEditVisitDraft({ date: v.date ? new Date(v.date).toISOString().slice(0, 10) : "", note: v.note || "" });

    setEditVisitDraft(null);

    setVisits((vs) =>

          : v
      )
    );
    setEditingVisitId(null);
    setEditVisitDraft(null);
  };

  const startRecording = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setMicUnavailable(true);
      return;
    }
    try {
      const recog = new SR();
      recog.continuous = true;
      recog.interimResults = false;
      recog.lang = "en-IN";
      recog.onresult = (e) => {
        let transcript = "";
        for (let i = e.resultIndex; i < e.results.length; i++) transcript += e.results[i][0].transcript;
        setVisitDraft((v) => ({ ...v, note: (v.note ? v.note + " " : "") + transcript }));
      };
      recog.onerror = () => setMicUnavailable(true);
      recog.onend = () => setRecording(false);
      recognitionRef.current = recog;
      recog.start();
      setRecording(true);
    } catch (e) {
      setMicUnavailable(true);
    }
  };

  const stopRecording = () => {
    if (recognitionRef.current) {
      try { recognitionRef.current.stop(); } catch (e) {}
    }
    setRecording(false);
  };

  const visitsThisMonth = (clientId) =>
    visits.filter((v) => v.clientId === clientId && monthKey(new Date(v.date)) === monthKey(today)).length;
  const visitsThisYear = (clientId) =>
    visits.filter((v) => v.clientId === clientId && new Date(v.date).getFullYear() === today.getFullYear()).length;

  const targetForPeriod = (c) => {
    if (c.visitPer === "month") return { monthTarget: c.visitCount, yearTarget: c.visitCount * 12 };
    if (c.visitPer === "days") {
      const monthTarget = Math.max(1, Math.round(30 / c.visitCount));
      const yearTarget = Math.max(1, Math.round(365 / c.visitCount));
      return { monthTarget, yearTarget };
    }
    return { monthTarget: null, yearTarget: c.visitCount };
  };

      setEditingClientId(null);
      setEditClientDraft(null);
    }

    setTimeout(() => setClientSavedMsg(""), 4000);
  };

  const startEditClient = (c) => {

      pan: c.pan || "",
      mobile: c.mobile || "",
      email: c.email || "",
      visitCount: c.visitCount || 1,

    setEditClientDraft(null);

      )

    setEditingClientId(null);
    setEditClientDraft(null);
    setClientSavedMsg(`"${updatedName}" updated successfully ✓`);
    setTimeout(() => setClientSavedMsg(""), 4000);
  };

  const addNote = (client) => {
    const text = (noteDraft[client.id] || "").trim();
    if (!text) return;
    setNotes((ns) => [
      { id: "n" + Date.now(), clientId: client.id, clientName: client.name, note: text, date: new Date().toISOString() },
      ...ns,
    ]);
    setNoteDraft((d0) => ({ ...d0, [client.id]: "" }));
  };

  const deleteNote = (id) => {
    const n = notes.find((nt) => nt.id === id);
    if (!n) return;
    const ok = window.confirm(`Delete this note for "${n.clientName}"? This cannot be undone.`);
    if (!ok) return;
    setNotes((ns) => ns.filter((nt) => nt.id !== id));
    if (editingNoteId === id) {
      setEditingNoteId(null);
      setEditNoteDraft("");
    }
  };

  const startEditNote = (n) => {
    setEditingNoteId(n.id);
    setEditNoteDraft(n.note || "");
  };

  const cancelEditNote = () => {
    setEditingNoteId(null);
    setEditNoteDraft("");
  };

  const saveEditNote = () => {
    if (!editNoteDraft.trim()) return;
    setNotes((ns) => ns.map((n) => (n.id === editingNoteId ? { ...n, note: editNoteDraft.trim() } : n)));
    setEditingNoteId(null);
    setEditNoteDraft("");
  };

  const downloadExcel = () => {
    const clientRows = clients.map((c) => ({
      "Client Name": c.name,
      GSTIN: c.gstin,
      PAN: c.pan,
      Mobile: c.mobile,
      Email: c.email,
    }));
    const noteRows = notes.map((n) => ({
      Client: n.clientName,
      Date: fmt(new Date(n.date)),
      "Issue discussed": n.note,
    }));
    const visitRows = visits.map((v) => ({
      Client: v.clientName,
      Date: fmt(new Date(v.date)),
      "Visit notes": v.note,
    }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(clientRows.length ? clientRows : [{ "Client Name": "" }]),
      "Clients"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(noteRows.length ? noteRows : [{ Client: "", Date: "", "Issue discussed": "" }]),
      "Discussion Log"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(visitRows.length ? visitRows : [{ Client: "", Date: "", "Visit notes": "" }]),
      "Site Visits"
    );
    XLSX.writeFile(wb, `khatadesk-clients-${monthKey(today)}.xlsx`);
  };

  const mailtoLink = (c) =>
    `mailto:${c.email}?subject=${encodeURIComponent(c.name + " — from your accountant")}`;

  const curMonthKey = monthKey(today);
  const curQuarterKey = quarterKey(today);

  const toggleCheckin = (clientId) => {
    const key = checkinMode === "monthly" ? curMonthKey : curQuarterKey;
    setCheckins((ci) => {
      const bucket = { ...(ci[checkinMode][key] || {}) };
      bucket[clientId] = !bucket[clientId];
      return { ...ci, [checkinMode]: { ...ci[checkinMode], [key]: bucket } };
    });
  };

  const currentTicks =
    (checkinMode === "monthly" ? checkins.monthly[curMonthKey] : checkins.quarterly[curQuarterKey]) || {};
  const remainingClients = clients.filter((c) => !currentTicks[c.id]);

  const sync = (key) => {
    setConnections((c) => ({ ...c, [key]: { ...c[key], syncing: true } }));
    setTimeout(() => {
      setConnections((c) => ({
        ...c,
        [key]: { ...c[key], syncing: false, last: "Just now" },
      }));
    }, 1200);
  };

  const types = ["All", ...Array.from(new Set(returns.map((r) => r.type)))];

  const allClientNames = useMemo(() => {
    const names = new Set(clients.map((c) => c.name));
    returns.forEach((r) => names.add(r.client));
    tasks.forEach((t) => t.client && names.add(t.client));
    return Array.from(names).filter(Boolean).sort();
  }, [clients, returns, tasks]);

  const staffCodes = useMemo(() => {
    const codes = new Set(["KS", "DD"]);
    returns.forEach((r) => {
      if (r.filedBy) codes.add(r.filedBy);
      if (r.verifiedBy) codes.add(r.verifiedBy);

  }, [returns]);

  return (

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        .disp { font-family: 'Fraunces', serif; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
        .ledger-row { border-left: 3px dashed #A63D2F33; }
        ::selection { background: #B8892B55; }
      `}</style>

      {/* header */}
      <header className="border-b" style={{ borderColor: "#1C2B4522", background: "#F5F1E8" }}>
        <div className="max-w-5xl mx-auto px-5 py-5 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div
              className="w-10 h-10 rounded-full flex items-center justify-center -rotate-6"
              style={{ border: "2px dashed #1C2B45" }}
            >
              <Stamp size={18} />
            </div>
            <div>
              <h1 className="disp text-2xl font-semibold leading-none">KhataDesk</h1>
              <p className="text-xs mono mt-1" style={{ color: "#1C2B4599" }}>
                {today.toLocaleDateString("en-IN", { weekday: "long", day: "2-digit", month: "long", year: "numeric" })}
              </p>
              <p className="text-[10px] mono mt-0.5" style={{ color: "#1C2B4560" }}>v1.1</p>
            </div>
          </div>

            <span className="text-xs mono hidden sm:inline" style={{ color: saveError ? "#A63D2F" : "#2F6B4F" }}>

              <Bell size={12} />

          </div>
        </div>

            { label: "Filed this cycle", value: stats.filedThisMonth, color: "#2F6B4F" },

                <input

                  className="sm:w-48 px-3 py-2 rounded text-sm outline-none"

                    <input

                    <div className="flex gap-2">

                            <div className="flex-1">
                              <span className="font-medium">{n.clientName}</span>{" "}
                              <span className="mono" style={{ color: "#1C2B4580" }}>{fmt(new Date(n.date))}</span>
                              <div style={{ color: "#1C2B4599" }}>{n.note}</div>
                            </div>
                            <button
                              onClick={() => startEditNote(n)}
                              className="flex items-center gap-1 px-2 py-1 rounded-full flex-shrink-0"
                              style={{ background: "#B8892B18", color: "#B8892B" }}
                              title="Edit note"
                            >
                              <Pencil size={11} />
                            </button>
                            <button
                              onClick={() => deleteNote(n.id)}
                              className="flex items-center gap-1 px-2 py-1 rounded-full flex-shrink-0"
                              style={{ background: "#A63D2F18", color: "#A63D2F" }}
                              title="Delete note"
                            >
                              <Trash2 size={11} />
                            </button>
                          </div>
                        )
                      )}
                    </div>
                  </div>
                )}
              </>
            )}
          </section>
        )}

        {/* CLIENTS */}
        {tab === "clients" && (
          <section>
            <div className="flex items-center justify-between mb-3">
              <h2 className="disp text-lg font-semibold">Clients</h2>
              <div className="flex items-center gap-2">
                <button
                  onClick={downloadExcel}
                  className="flex items-center gap-1 text-xs mono px-3 py-1.5 rounded-full"
                  style={{ background: "#1C2B4512", color: "#1C2B45" }}
                >
                  <Download size={12} /> Download Excel
                </button>
                <button
                  onClick={() => {
                    setShowAddClient((v) => !v);
                    setEditingClientId(null);
                    setEditClientDraft(null);
                  }}
                  className="flex items-center gap-1 text-xs mono px-3 py-1.5 rounded-full"
                  style={{ background: "#2F6B4F", color: "#F5F1E8" }}
                >
                  <Plus size={12} /> Add client
                </button>
              </div>
            </div>

            {clientSavedMsg && (
              <div
                className="mb-4 px-4 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2"
                style={{ background: "#2F6B4F18", border: "1px solid #2F6B4F", color: "#2F6B4F" }}
              >
                <CheckCircle2 size={16} /> {clientSavedMsg}
              </div>
            )}

            {showAddClient && (
              <div className="mb-4 p-4 rounded-lg grid grid-cols-1 sm:grid-cols-2 gap-2" style={{ background: "#FFFDF8", border: "1px solid #1C2B4518" }}>
                <input
                  placeholder="Client / firm name"
                  value={newClient.name}
                  onChange={(e) => setNewClient({ ...newClient, name: e.target.value })}
                  className="sm:col-span-2 px-3 py-2 rounded text-sm outline-none"
                  style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                />
                <input
                  placeholder="GSTIN (15 char)"
                  value={newClient.gstin}
                  maxLength={15}
                  onChange={(e) => setNewClient({ ...newClient, gstin: e.target.value.toUpperCase() })}
                  className="px-3 py-2 rounded text-sm mono outline-none"
                  style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                />
                <input
                  placeholder="PAN (10 char)"
                  value={newClient.pan}
                  maxLength={10}
                  onChange={(e) => setNewClient({ ...newClient, pan: e.target.value.toUpperCase() })}
                  className="px-3 py-2 rounded text-sm mono outline-none"
                  style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                />
                <input
                  placeholder="Mobile number"
                  value={newClient.mobile}
                  maxLength={10}
                  onChange={(e) => setNewClient({ ...newClient, mobile: e.target.value.replace(/\D/g, "") })}
                  className="px-3 py-2 rounded text-sm mono outline-none"
                  style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                />
                <input
                  placeholder="Email address"
                  type="email"
                  value={newClient.email}
                  onChange={(e) => setNewClient({ ...newClient, email: e.target.value })}
                  className="px-3 py-2 rounded text-sm mono outline-none"
                  style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                />
                <div className="sm:col-span-2 flex items-center gap-2">
                  <span className="text-xs whitespace-nowrap" style={{ color: "#1C2B4599" }}>Visit every</span>
                  <input
                    type="number"
                    min="1"
                    value={newClient.visitCount}
                    onChange={(e) => setNewClient({ ...newClient, visitCount: e.target.value === "" ? "" : Math.max(1, Number(e.target.value)) })}
                    className="w-16 px-2 py-2 rounded text-sm mono outline-none text-center"
                    style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                  />
                  <select
                    value={newClient.visitPer}
                    onChange={(e) => setNewClient({ ...newClient, visitPer: e.target.value })}
                    className="flex-1 px-3 py-2 rounded text-sm outline-none"
                    style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                  >
                    <option value="days">day(s)</option>
                    <option value="month">time(s) / month</option>
                    <option value="year">time(s) / year</option>
                  </select>
                </div>
                <button onClick={addClient} className="px-4 py-2 rounded text-sm font-medium sm:col-span-2" style={{ background: "#1C2B45", color: "#F5F1E8" }}>
                  Save client
                </button>
              </div>
            )}

            {clients.length === 0 ? (
              <div className="p-6 rounded-lg text-sm text-center" style={{ background: "#FFFDF8", border: "1px dashed #1C2B4530", color: "#1C2B4599" }}>
                No clients added yet — use "Add client" above to build your roster.
              </div>
            ) : (
              <div className="space-y-2">
                {clients.map((c) =>
                  editingClientId === c.id ? (
                    <div
                      key={c.id}
                      className="p-4 rounded-lg grid grid-cols-1 sm:grid-cols-2 gap-2"
                      style={{ background: "#FFFDF8", border: "2px solid #B8892B" }}
                    >
                      <div className="sm:col-span-2 flex items-center gap-2 text-xs font-medium mono" style={{ color: "#B8892B" }}>
                        <Pencil size={12} /> Editing: {c.name}
                      </div>
                      <input
                        placeholder="Client / firm name"
                        value={editClientDraft.name}
                        onChange={(e) => setEditClientDraft({ ...editClientDraft, name: e.target.value })}
                        className="sm:col-span-2 px-3 py-2 rounded text-sm outline-none"
                        style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                      />
                      <input
                        placeholder="GSTIN (15 char)"
                        value={editClientDraft.gstin}
                        maxLength={15}
                        onChange={(e) => setEditClientDraft({ ...editClientDraft, gstin: e.target.value.toUpperCase() })}
                        className="px-3 py-2 rounded text-sm mono outline-none"
                        style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                      />
                      <input
                        placeholder="PAN (10 char)"
                        value={editClientDraft.pan}
                        maxLength={10}
                        onChange={(e) => setEditClientDraft({ ...editClientDraft, pan: e.target.value.toUpperCase() })}
                        className="px-3 py-2 rounded text-sm mono outline-none"
                        style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                      />
                      <input
                        placeholder="Mobile number"
                        value={editClientDraft.mobile}
                        maxLength={10}
                        onChange={(e) => setEditClientDraft({ ...editClientDraft, mobile: e.target.value.replace(/\D/g, "") })}
                        className="px-3 py-2 rounded text-sm mono outline-none"
                        style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                      />
                      <input
                        placeholder="Email address"
                        type="email"
                        value={editClientDraft.email}
                        onChange={(e) => setEditClientDraft({ ...editClientDraft, email: e.target.value })}
                        className="px-3 py-2 rounded text-sm mono outline-none"
                        style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                      />
                      <div className="sm:col-span-2 flex items-center gap-2">
                        <span className="text-xs whitespace-nowrap" style={{ color: "#1C2B4599" }}>Visit every</span>
                        <input
                          type="number"
                          min="1"
                          value={editClientDraft.visitCount}
                          onChange={(e) => setEditClientDraft({ ...editClientDraft, visitCount: e.target.value === "" ? "" : Math.max(1, Number(e.target.value)) })}
                          className="w-16 px-2 py-2 rounded text-sm mono outline-none text-center"
                          style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                        />
                        <select
                          value={editClientDraft.visitPer}
                          onChange={(e) => setEditClientDraft({ ...editClientDraft, visitPer: e.target.value })}
                          className="flex-1 px-3 py-2 rounded text-sm outline-none"
                          style={{ border: "1px solid #1C2B4530", background: "#F5F1E8" }}
                        >
                          <option value="days">day(s)</option>
                          <option value="month">time(s) / month</option>
                          <option value="year">time(s) / year</option>
                        </select>
                      </div>
                      <div className="sm:col-span-2 flex gap-2">
                        <button onClick={saveEditClient} className="flex-1 flex items-center justify-center gap-1 px-4 py-2 rounded text-sm font-medium" style={{ background: "#2F6B4F", color: "#F5F1E8" }}>
                          <Save size={14} /> Save changes
                        </button>
                        <button onClick={cancelEditClient} className="flex-1 px-4 py-2 rounded text-sm font-medium" style={{ background: "#1C2B4512", color: "#1C2B45" }}>
                          Cancel
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div
                      key={c.id}
                      className="ledger-row flex items-center gap-3 pl-3 pr-4 py-3 rounded-r-md"
                      style={{ background: "#FFFDF8" }}
                    >
                      <div className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: "#1C2B4512" }}>
                        <Users size={15} color="#1C2B45" />
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="text-sm font-medium truncate">{c.name}</div>
                        <div className="text-xs mono mt-0.5 flex flex-wrap gap-x-3" style={{ color: "#1C2B4580" }}>
                          <span>GSTIN: {c.gstin || "—"}</span>
                          <span>PAN: {c.pan || "—"}</span>
                          <span className="flex items-center gap-1"><Phone size={10} />{c.mobile || "—"}</span>
                          <span>{c.email || "—"}</span>
                        </div>
                      </div>
                      {c.email && (
                        <a href={mailtoLink(c)} title="Email this client">
                          <Send size={15} color="#1C2B4580" />
                        </a>
                      )}
                      <button
                        onClick={() => startEditClient(c)}
                        title="Edit client"
                        className="flex items-center gap-1 text-xs mono px-2.5 py-1.5 rounded-full flex-shrink-0"
                        style={{ background: "#B8892B18", color: "#B8892B" }}
                      >
                        <Pencil size={12} /> Edit
                      </button>
                      <button
                        onClick={() => deleteClient(c.id)}
                        title="Delete client"
                        className="flex items-center gap-1 text-xs mono px-2.5 py-1.5 rounded-full flex-shrink-0"
                        style={{ background: "#A63D2F18", color: "#A63D2F" }}
                      >
                        <Trash2 size={12} /> Delete
                      </button>
                    </div>
                  )
                )}
              </div>
            )}
          </section>
        )}

        {/* CONNECTIONS */}
        {tab === "connections" && (
          <section>
            <h2 className="disp text-lg font-semibold mb-1">Connections</h2>
            <p className="text-sm mb-5" style={{ color: "#1C2B4599" }}>
              This demo shows the intended flow. Wiring these up for real needs a small backend: Tally's
              ODBC/XML export, an IMAP/Graph mailbox connection, and an Excel import parser.
            </p>
            <div className="space-y-3">
              {[
                { key: "mail", icon: Mail, name: "Mail", desc: "Sends return & task reminders to clients automatically" },
                { key: "excel", icon: FileSpreadsheet, name: "Excel", desc: "Bulk-import client due dates and reconcile working files" },
                { key: "tally", icon: Database, name: "Tally", desc: "Pulls voucher & ledger data to flag pending entries" },
              ].map((c) => (
                <div key={c.key} className="flex items-center gap-4 p-4 rounded-lg" style={{ background: "#FFFDF8", border: "1px solid #1C2B4518" }}>
                  <div className="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: "#1C2B4512" }}>
                    <c.icon size={18} color="#1C2B45" />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-medium">{c.name}</div>
                    <div className="text-xs mt-0.5" style={{ color: "#1C2B4580" }}>{c.desc}</div>
                    <div className="text-xs mono mt-1" style={{ color: "#2F6B4F" }}>
                      ● Connected · last synced {connections[c.key].last}
                    </div>
                  </div>
                  <button
                    onClick={() => sync(c.key)}
                    disabled={connections[c.key].syncing}
                    className="flex items-center gap-1 text-xs mono px-3 py-1.5 rounded-full flex-shrink-0"
                    style={{ background: "#1C2B45", color: "#F5F1E8" }}
                  >
                    <RefreshCw size={12} className={connections[c.key].syncing ? "animate-spin" : ""} />
                    {connections[c.key].syncing ? "Syncing" : "Sync now"}
                  </button>
                </div>
              ))}
            </div>
          </section>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(KhataDesk));

</script>

<script>
(function () {
  var src = document.getElementById('khatadesk-source').textContent;
  var out = Babel.transform(src, {
    presets: [["react", { runtime: "classic" }]]
  }).code;
  (0, eval)(out);
})();
</script>

<!-- Small floating status badge, kept outside React so it works no matter
     what the app's own UI looks like. Shows whether this view is syncing
     through the artifact's built-in cloud storage (automatic when opened
     as a Claude artifact while signed in) or just saving to this device. -->
<div id="khatadesk-sync-badge" style="position:fixed;bottom:14px;right:14px;z-index:99999;font-family:Inter,sans-serif;font-size:12px;">
  <div id="khatadesk-sync-btn" style="background:#1C2B45;color:#F5F1E8;border:none;border-radius:999px;padding:8px 14px;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;gap:6px;">
    <span id="khatadesk-sync-dot" style="width:8px;height:8px;border-radius:50%;background:#999;display:inline-block;"></span>
    <span id="khatadesk-sync-label">Checking sync…</span>
  </div>
</div>
<script>
(function () {
  function setBadge(on) {
    document.getElementById('khatadesk-sync-dot').style.background = on ? '#2E7D32' : '#999';
    document.getElementById('khatadesk-sync-label').textContent = on
      ? 'Synced across devices'
      : 'Local only (set up cloud sync — see SYNC-SETUP.txt)';
  }
  (window.KhataDeskSync ? window.KhataDeskSync.isAvailable() : Promise.resolve(false)).then(setBadge);
})();
</script>
</body>
</html>
